name: monitor

# Langfuse runs on the student's computer, so this job needs a self-hosted
# runner on that computer (label cartwheel-monitor). The runner is started by
# hand, so the job runs only on a manual trigger, never on a schedule or a pull
# request. The Langfuse keys and host come from the runner's own .env file on
# that computer, not from GitHub.
on:
  workflow_dispatch:
    inputs:
      hours:
        description: Monitor the traces of the last N hours
        default: "24"

permissions:
  contents: read

concurrency:
  group: monitor

jobs:
  monitor:
    name: sample, judge and score recent traces
    runs-on: [self-hosted, cartwheel-monitor]
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      HOURS: ${{ inputs.hours || '24' }}
    steps:
      # The repository is public, so mask the keys in case any output prints them.
      - name: Check the runner's Langfuse settings
        run: |
          for name in LANGFUSE_HOST LANGFUSE_PUBLIC_KEY LANGFUSE_SECRET_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not set in the runner's .env file"
              exit 1
            fi
          done
          echo "::add-mask::$LANGFUSE_PUBLIC_KEY"
          echo "::add-mask::$LANGFUSE_SECRET_KEY"

      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync

      # The judge input's session line reads the caller's store from the
      # seeded world database, as in Homework 5.
      - name: Seed the world database
        run: uv run python -m seed.generate

      - name: Monitor the last ${{ env.HOURS }} hours
        run: |
          mkdir -p monitoring/output
          set -o pipefail
          uv run python -m monitoring.run --last-hours "$HOURS" 2>&1 | tee monitoring/output/monitor.log

      - name: Upload the monitoring output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitor-${{ github.run_id }}
          path: |
            monitoring/output
            monitoring/history.jsonl
            monitoring/prevalence.svg
          if-no-files-found: warn
